<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltline Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="toolbar">
    <header class="brand">
      <h1>Saltline Cover Studio</h1>
      <p>Poster-system key art from your own photos: masthead, cast callouts, chrome lettering.</p>
    </header>

    <section class="group">
      <h2>Photos</h2>
      <div id="photo-strip" class="photo-strip"></div>
      <label class="file-label">Add photos
        <input id="photo-file" type="file" accept="image/*" multiple>
      </label>
      <p class="hint">Or drop image files onto the preview. Click a panel, then a photo, to assign it. Drag a panel to reframe it, scroll to zoom.</p>
    </section>

    <section class="group">
      <h2>Layout</h2>
      <label>Arrangement <select id="layout"></select></label>
      <p id="panel-label" class="hint">Panel 1 of 5</p>
      <label>Callout label <input id="callout-label" type="text" maxlength="24" value="THE DRIVER"></label>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label class="check"><input id="smart-crop" type="checkbox" checked> Smart crop this panel</label>
      <div class="row">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="auto-cover" type="button">Auto Cover</button>
      </div>
    </section>

    <section class="group">
      <h2>Grade</h2>
      <label>Colour grade <select id="grade"></select></label>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <label>Title <input id="caption" type="text" maxlength="34" value="NEON SHORES"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Saltline City"></label>
    </section>

    <section class="group">
      <h2>Poster</h2>
      <label class="check"><input id="furniture" type="checkbox" checked> Masthead, title block &amp; credits</label>
      <label class="check"><input id="callouts" type="checkbox" checked> Cast callouts</label>
    </section>

    <section class="group">
      <h2>Export</h2>
      <div class="row wrap">
        <button class="export-btn" data-size="1080x1080" type="button">PNG 1080×1080</button>
        <button class="export-btn" data-size="1080x1350" type="button">PNG 1080×1350</button>
        <button class="export-btn" data-size="1920x1080" type="button">PNG 1920×1080</button>
        <button class="export-btn" data-size="1080x1920" type="button">PNG 1080×1920</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>

  <section id="canvas-wrap" class="stage">
    <canvas id="cover" width="1920" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
